name: Build and Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: write

env:
  LIBFPRINT_TOD_REPO: https://gitlab.freedesktop.org/3v1n0/libfprint.git
  LIBFPRINT_TOD_BRANCH: tod

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies & FPM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config cmake \
            git wget innoextract ruby ruby-dev rpm tar zstd libarchive-tools \
            libfprint-2-tod-dev \
            libusb-1.0-0-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libcap-dev \
            libseccomp-dev \
            libglib2.0-dev \
            libdbus-glib-1-dev \
            libjson-glib-dev \
            libgudev-1.0-dev \
            libgusb-dev \
            libnss3-dev \
            libpixman-1-dev \
            gtk-doc-tools
          sudo gem install --no-document fpm

      - name: Configure build (meson setup)
        run: meson setup build --prefix=/usr --buildtype=release

      - name: Build (ninja)
        run: ninja -C build

      - name: Install to temporary packaging directory
        run: |
          mkdir -p "${{ github.workspace }}/pkgroot"
          DESTDIR="${{ github.workspace }}/pkgroot" ninja -C build install

      - name: Create Packages (.tar.gz, .deb, .rpm, .pkg.tar.zst)
        id: package
        run: |
          RAW_VERSION="${GITHUB_REF_NAME:-0.0.1}"
          VERSION="${RAW_VERSION#v}"
          if [[ -z "\(VERSION" || "\)VERSION" == "\(RAW_VERSION" && "\)RAW_VERSION" == dev* ]]; then
            VERSION="0.0.1+$(git rev-parse --short HEAD)"
          fi

          PKG_BASE="synatudor"
          ARCH="x86_64"
          mkdir -p dist

          PKG_NAME="\({PKG_BASE}-\){VERSION}-${ARCH}-linux-gnu"
          tar -C pkgroot -czvf "dist/${PKG_NAME}.tar.gz" .

          fpm -s dir -t deb \
            -n "$PKG_BASE" \
            -v "$VERSION" \
            -a "$ARCH" \
            -m "Maintainer " \
            --description "Synaptics Tudor Touch Fingerprint Driver" \
            -C pkgroot \
            -p "dist/\({PKG_BASE}_\){VERSION}_amd64.deb" \
            usr/ sbin/

          fpm -s dir -t rpm \
            -n "$PKG_BASE" \
            -v "$VERSION" \
            -a "$ARCH" \
            -m "Maintainer " \
            --description "Synaptics Tudor Touch Fingerprint Driver" \
            -C pkgroot \
            -p "dist/\({PKG_BASE}-\){VERSION}-1.${ARCH}.rpm" \
            usr/ sbin/

          fpm -s dir -t pacman \
            -n "$PKG_BASE" \
            -v "$VERSION" \
            -a "$ARCH" \
            -m "Maintainer " \
            --description "Synaptics Tudor Touch Fingerprint Driver" \
            -C pkgroot \
            -p "dist/\({PKG_BASE}-\){VERSION}-1-x86_64.pkg.tar.zst" \
            usr/ sbin/

          cd dist
          sha256sum * > SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synatudor-package
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: synatudor-package
          path: dist

      - name: Create GitHub Release and upload package
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
